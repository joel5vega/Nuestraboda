<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fondo -->
  <rect width="32" height="32" rx="6" fill="#0C1622"/>
  <!-- Anillo izquierdo -->
  <circle cx="12" cy="16" r="7" stroke="#8FAFC2" stroke-width="2.2" fill="none"/>
  <!-- Anillo derecho (encima en la intersección derecha) -->
  <circle cx="20" cy="16" r="7" stroke="#8FAFC2" stroke-width="2.2" fill="none"
    stroke-dasharray="32 12"
    stroke-dashoffset="-22"/>
  <!-- Anillo izquierdo arco frontal (tapa el derecho en la intersección izquierda) -->
  <circle cx="12" cy="16" r="7" stroke="#4A7FA5" stroke-width="2.2" fill="none"
    stroke-dasharray="12 32"
    stroke-dashoffset="-10"/>
</svg>